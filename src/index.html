<!doctype html>
<html lang="en" data-theme="ledger">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Plan and visualize workloads on HyperShift / Hosted Control Plane clusters." />
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<title>Calctainer · HCP workload planner</title>
		<script>
			try {
				const m = localStorage.getItem('calctainer:mode-scheme');
				if (m === 'dark' || (!m && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
			} catch {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/main.ts"></script>
	</body>
</html>
